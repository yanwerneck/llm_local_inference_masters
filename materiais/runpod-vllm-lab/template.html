<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>RunPod + vLLM · Laboratório do Yan</title>
<style>
:root{--ink:#20332f;--muted:#566960;--accent:#176650;--paper:#fcfbf7;--line:#dce3dc}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:24px}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.75 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:var(--accent);text-underline-offset:3px;overflow-wrap:anywhere}a:hover{color:#ad562e}a:focus-visible,button:focus-visible{outline:3px solid #ca794b;outline-offset:4px}.layout{max-width:1400px;margin:auto;display:grid;grid-template-columns:280px minmax(0,1fr);gap:54px;padding:40px}aside{position:sticky;top:28px;height:calc(100vh - 56px);overflow:auto;padding-right:20px;font-size:13px}aside .brand{font-size:17px;font-weight:750;letter-spacing:-.5px;margin-bottom:5px}aside .sub{color:var(--muted);margin-bottom:25px}.toc ul{list-style:none;padding:0}.toc li{margin:0 0 12px}.toc a{text-decoration:none;display:block;padding-left:12px;border-left:2px solid var(--line)}.toc a:hover{border-color:var(--accent)}main{max-width:910px;min-width:0}header{border-top:5px solid var(--accent);padding:22px 0 20px;display:flex;justify-content:space-between;gap:15px;align-items:center}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:750;color:var(--accent)}.badge{border:1px solid var(--line);border-radius:30px;padding:4px 12px;font-size:12px;color:var(--muted)}h1{font-size:clamp(32px,4.4vw,54px);line-height:1.12;letter-spacing:-2px;max-width:760px;margin:20px 0 24px}h2{font-size:28px;line-height:1.3;letter-spacing:-.8px;margin:66px 0 22px;border-top:1px solid var(--line);padding-top:28px}h3{font-size:21px;margin-top:32px}p{margin:0 0 20px}li{margin-bottom:9px}strong{font-weight:700}code{font: .86em/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere;background:#edf0e9;border-radius:4px;padding:2px 5px}pre{background:#172c29;color:#ebf5ef;border-radius:12px;padding:24px;overflow:auto;line-height:1.65;margin:0}pre code{background:transparent;padding:0;color:inherit;overflow-wrap:normal;font-size:13px}.code-wrap{margin:24px 0;position:relative}.code-bar{background:#233e37;color:#b8d7c9;border-radius:12px 12px 0 0;padding:7px 14px;display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:1px}.code-bar+pre{border-radius:0 0 12px 12px}button{cursor:pointer;font:inherit;font-size:12px;background:transparent;border:1px solid #6a9384;color:#f0fff7;padding:4px 10px;border-radius:5px}button:hover{background:#37594d}.table-wrap{overflow-x:auto;margin:24px 0;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.6}th{text-align:left;background:#e9eee5;font-weight:700}td,th{padding:14px 16px;vertical-align:top;border-bottom:1px solid var(--line);min-width:170px}tr:last-child td{border-bottom:0}tr:nth-child(even){background:#f4f5ef}footer{margin:60px 0 20px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}.mobile-nav{display:none}.status{font-size:12px;color:var(--muted)}
@media(max-width:1050px){.layout{gap:28px;padding:25px;grid-template-columns:220px minmax(0,1fr)}aside{font-size:12px}}
@media(max-width:760px){.layout{display:block;padding:20px}aside{position:static;height:auto;padding:0}.toc{display:none}.mobile-nav{display:block;margin:15px 0 25px}.mobile-nav .toc{display:block}aside>.brand,aside>.sub{display:none}h1{letter-spacing:-1px}h2{font-size:25px;margin-top:45px}header{padding-top:16px}.badge{display:none}body{font-size:16px}pre{padding:16px}}
@media print{aside,button,.code-bar,.mobile-nav{display:none!important}.layout{display:block;padding:0}main{max-width:none}body{font-size:11pt;background:white}h1{font-size:28pt}h2{font-size:18pt;margin-top:25pt}pre{white-space:pre-wrap;background:#f1f3ef;color:black;border:1px solid #ccc}pre code{font-size:9pt}a{color:inherit}table{font-size:9pt}header{border-top-width:2px}.table-wrap{overflow:visible}}
</style>
</head>
<body>
<div class="layout">
<aside aria-label="Navegação do guia"><div class="brand">Laboratório do Yan</div><div class="sub">Inferência local de LLMs · UFF</div><!-- NAV --></aside>
<main>
<header><span class="eyebrow">RunPod × vLLM</span><span class="badge">RTX 3090 · Qwen 14B · GPTQ Int8</span></header>
<details class="mobile-nav"><summary>Ir para uma etapa</summary><nav aria-label="Etapas no celular"></nav></details>
<article><!-- CONTENT --></article>
<footer>Guia de aprendizado, não resultado de benchmark. HTML autônomo: não depende de internet para leitura. Links de referência abrem as fontes externas. <a href="README.md">Versão Markdown</a>.</footer>
<div class="status" role="status" aria-live="polite" id="copy-status"></div>
</main>
</div>
<script>
const toc=document.querySelector('aside .toc');
if(toc) document.querySelector('.mobile-nav nav').append(toc.cloneNode(true));
document.querySelectorAll('table').forEach(table=>{const wrap=document.createElement('div');wrap.className='table-wrap';table.before(wrap);wrap.append(table)});
document.querySelectorAll('pre').forEach(pre=>{
  const wrap=document.createElement('div');wrap.className='code-wrap';pre.before(wrap);
  const bar=document.createElement('div');bar.className='code-bar';
  const label=document.createElement('span');label.textContent=pre.querySelector('.language-bash')?'TERMINAL DO POD':'NOTAS';
  const button=document.createElement('button');button.type='button';button.textContent='Copiar';button.setAttribute('aria-label','Copiar este bloco');
  button.addEventListener('click',async()=>{
    const text=pre.textContent;let copied=false;
    try{await navigator.clipboard.writeText(text);copied=true}catch(error){
      const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();
      try{copied=document.execCommand('copy')}catch(error){}area.remove();
    }
    button.textContent=copied?'Copiado':'Selecione o texto';
    document.querySelector('#copy-status').textContent=copied?'Bloco copiado.':'Não foi possível copiar automaticamente; selecione e copie o bloco.';
    setTimeout(()=>button.textContent='Copiar',2000);
  });bar.append(label,button);wrap.append(bar,pre);
});
</script>
</body>
</html>
